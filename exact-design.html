<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=.25,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#062d5b">
<title>معاينة التصميم المعتمد</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe6ee;font-family:Tahoma,Arial,sans-serif}button{font:inherit}
#stage{position:fixed;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#dfe6ee;direction:ltr}
#wrap{position:relative;margin:0 auto}#canvas{position:absolute;left:0;top:0;width:1536px;height:1024px;transform-origin:0 0;background:#fff;box-shadow:0 12px 40px rgba(0,29,62,.24);direction:ltr;overflow:hidden}
#reference{position:absolute;inset:0;width:1536px;height:1024px;object-fit:cover;image-rendering:auto;display:block;z-index:1}.mask{position:absolute;z-index:2;pointer-events:none}.mask.navy{background:#082f5c}.mask.gold{background:#b28b3b}.mask.white{background:#fff}
.credit-first{position:absolute;z-index:3;left:508px;top:790px;width:520px;height:24px;background:#fff;display:flex;align-items:center;justify-content:center;color:#0b315b;font-size:13px;font-weight:700;direction:rtl}
.hot{position:absolute;z-index:5;border:0;background:transparent;padding:0;cursor:pointer;border-radius:7px}.hot:focus-visible{outline:3px solid #f2c761;outline-offset:-3px}
#toast{position:fixed;z-index:30;left:50%;bottom:22px;transform:translateX(-50%);background:#062d5b;color:#fff;border:1px solid #d5aa47;border-radius:10px;padding:11px 18px;display:none;box-shadow:0 9px 30px rgba(0,0,0,.22);white-space:nowrap;direction:rtl}#toast.show{display:block}
#pageOverlay{position:absolute;z-index:4;left:332px;top:168px;width:1061px;height:656px;border:1px solid #173b60;border-radius:13px;background:#fff;display:none;overflow:hidden;direction:rtl}#pageOverlay.show{display:block}
.overlay-head{height:83px;border-bottom:2px solid #d4a53d;display:flex;align-items:center;justify-content:center;color:#0b315b;font-size:27px;font-weight:900}.overlay-body{height:573px;padding:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#0b315b}.overlay-body h2{font-size:34px;margin:0 0 16px}.overlay-body p{font-size:17px;color:#52677e;line-height:1.9;margin:0;max-width:700px}.overlay-credit{margin-top:auto;font-size:22px;font-weight:900;color:#0b315b;padding-bottom:38px}
@media print{#stage{overflow:visible}#wrap{width:1536px!important;height:1024px!important}#canvas{transform:none!important}#toast{display:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="wrap"><div id="canvas" aria-label="نظام إدارة توزيع الطاقة الكهربائية"><img id="reference" alt="التصميم المرجعي المعتمد">
  <div class="mask navy" style="left:493px;top:96px;width:557px;height:59px"></div>
  <div class="mask gold" style="left:225px;top:156px;width:31px;height:39px;border-radius:5px"></div>
  <div class="mask navy" style="left:225px;top:199px;width:31px;height:339px"></div>
  <div class="mask navy" style="left:225px;top:552px;width:31px;height:219px"></div>
  <div class="mask white" style="left:347px;top:927px;width:1120px;height:25px"></div>
  <div class="credit-first">إعداد الفني/عبدالله عسيري</div>
  <section id="pageOverlay" aria-live="polite"><div class="overlay-head" id="overlayHead">الاعتماد والتوثيق</div><div class="overlay-body"><h2 id="overlayTitle">الاعتماد والتوثيق</h2><p id="overlayText">هذه الصفحة الأخيرة في النظام.</p><div class="overlay-credit" id="overlayCredit">إعداد الفني/عبدالله عسيري</div></div></section>
  <button class="hot" data-page="home" aria-label="الصفحة الرئيسية" style="left:15px;top:155px;width:248px;height:40px"></button>
  <button class="hot" data-page="index" aria-label="الفهرس" style="left:15px;top:199px;width:248px;height:39px"></button>
  <button class="hot" data-page="diagram" aria-label="المخطط العام" style="left:15px;top:242px;width:248px;height:40px"></button>
  <button class="hot" data-page="tr1" aria-label="المحول 1" style="left:15px;top:327px;width:248px;height:41px"></button>
  <button class="hot" data-page="tr2" aria-label="المحول 2" style="left:15px;top:372px;width:248px;height:41px"></button>
  <button class="hot" data-page="tr3" aria-label="المحول 3" style="left:15px;top:417px;width:248px;height:41px"></button>
  <button class="hot" data-page="tr4" aria-label="المحول 4" style="left:15px;top:462px;width:248px;height:41px"></button>
  <button class="hot" data-page="tr5" aria-label="المحول 5" style="left:15px;top:507px;width:248px;height:41px"></button>
  <button class="hot" data-page="generators" aria-label="المولدات" style="left:15px;top:552px;width:248px;height:41px"></button>
  <button class="hot" data-page="ups" aria-label="UPS" style="left:15px;top:595px;width:248px;height:41px"></button>
  <button class="hot" data-page="search" aria-label="البحث" style="left:15px;top:640px;width:248px;height:41px"></button>
  <button class="hot" id="printHot" aria-label="الطباعة" style="left:15px;top:684px;width:248px;height:41px"></button>
  <button class="hot" data-page="approval" aria-label="الاعتماد والتوثيق" style="left:15px;top:729px;width:248px;height:41px"></button>
  <button class="hot" data-page="tr1" aria-label="بطاقة TR1" style="left:386px;top:607px;width:171px;height:173px"></button>
  <button class="hot" data-page="tr2" aria-label="بطاقة TR2" style="left:580px;top:607px;width:171px;height:173px"></button>
  <button class="hot" data-page="tr3" aria-label="بطاقة TR3" style="left:771px;top:607px;width:171px;height:173px"></button>
  <button class="hot" data-page="tr4" aria-label="بطاقة TR4" style="left:962px;top:607px;width:171px;height:173px"></button>
  <button class="hot" data-page="tr5" aria-label="بطاقة TR5" style="left:1155px;top:607px;width:171px;height:173px"></button>
  <button class="hot" id="printTop" aria-label="طباعة" style="left:1180px;top:30px;width:78px;height:41px"></button>
  <button class="hot" id="fullTop" aria-label="ملء الشاشة" style="left:1264px;top:30px;width:105px;height:41px"></button>
  <button class="hot" id="langTop" aria-label="English" style="left:1384px;top:30px;width:55px;height:41px"></button>
  <button class="hot" id="prevSection" aria-label="القسم السابق" style="left:318px;top:108px;width:160px;height:35px"></button>
  <button class="hot" id="nextSection" aria-label="القسم التالي" style="left:1355px;top:108px;width:154px;height:35px"></button>
  <button class="hot" id="zoomOut" aria-label="تصغير" style="left:1078px;top:109px;width:39px;height:35px"></button>
  <button class="hot" id="zoomIn" aria-label="تكبير" style="left:1176px;top:109px;width:39px;height:35px"></button>
</div></div></div><div id="toast"></div>
<script src="exact-tiny.js"></script>
<script>
const stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),canvas=document.getElementById('canvas'),toast=document.getElementById('toast'),overlay=document.getElementById('pageOverlay');
document.getElementById('reference').src='data:image/webp;base64,'+window.__exactTiny;let scale=1;const order=['home','index','diagram','tr1','tr2','tr3','tr4','tr5','generators','ups','search','approval'];let current=0;
const labels={home:'الصفحة الرئيسية',index:'الفهرس',diagram:'المخطط العام لتوزيع الكهرباء',tr1:'المحول رقم 1 (TR1)',tr2:'المحول رقم 2 (TR2)',tr3:'المحول رقم 3 (TR3)',tr4:'المحول رقم 4 (TR4)',tr5:'المحول رقم 5 (TR5)',generators:'مولدات المستشفى',ups:'أنظمة UPS والبطاريات',search:'البحث في المشروع',approval:'الاعتماد والتوثيق'};
function layout(){wrap.style.width=(1536*scale)+'px';wrap.style.height=(1024*scale)+'px';canvas.style.transform='scale('+scale+')'}function fit(){scale=Math.min(1,innerWidth/1536);layout()}function show(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),1600)}
function openPage(name){current=Math.max(0,order.indexOf(name));if(name==='home'){overlay.classList.remove('show');return}overlay.classList.add('show');overlayHead.textContent=labels[name];overlayTitle.textContent=labels[name];overlayText.textContent=name==='approval'?'هذه الصفحة الأخيرة في النظام.':'تم تجهيز موضع هذا القسم داخل نفس الواجهة المعتمدة، وسيتم ربط بياناته التفصيلية دون تغيير شكل التصميم.';overlayCredit.style.display=name==='approval'?'block':'none';show(labels[name])}
addEventListener('load',fit);addEventListener('resize',()=>{if(scale<=1)fit()});document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));zoomIn.onclick=()=>{scale=Math.min(2,scale+.1);layout()};zoomOut.onclick=()=>{scale=Math.max(.25,scale-.1);layout()};fullTop.onclick=()=>document.documentElement.requestFullscreen?.();printTop.onclick=printHot.onclick=()=>print();langTop.onclick=()=>show('English / العربية');nextSection.onclick=()=>openPage(order[(current+1)%order.length]);prevSection.onclick=()=>openPage(order[(current-1+order.length)%order.length]);
</script></body></html>
