name: Audit electrical rebuild

on:
  push:
    branches: [main, rebuild-review]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check data-patches.js
          node --check app.js
          node --check extras.js
          node --check scripts/validate-data.js
          node --check scripts/audit-rebuild.js

      - name: Run data validation
        run: |
          node scripts/validate-data.js
          node scripts/audit-rebuild.js

      - name: Verify required files
        run: |
          test -f index.html
          test -f 404.html
          test -f styles.css
          test -f extras.css
          test -f hospital_logo_white.png
