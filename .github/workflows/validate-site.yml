name: Validate electrical system

on:
  push:
    branches: [main, rebuild-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
          node --check data-patches.js
          node --check scripts/validate-data.js

      - name: Validate electrical data
        run: node scripts/validate-data.js

      - name: Verify required site files
        run: |
          test -f index.html
          test -f styles.css
          test -f hospital_logo_white.png
