<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#062d5b">
<title>الواجهة المعتمدة — نظام إدارة توزيع الطاقة الكهربائية</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe6ef;font-family:Tahoma,Arial,sans-serif}.stage{width:100vw;height:100vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#dfe6ef}.canvas{position:relative;width:1280px;height:853px;transform-origin:top right;transform:scale(var(--scale,1));background:#fff;box-shadow:0 18px 60px rgba(0,25,55,.24)}#reference{display:block;width:1280px;height:853px;user-select:none;-webkit-user-drag:none}.hotspot{position:absolute;display:block;border:0;background:transparent;cursor:pointer;z-index:4}.hotspot:focus-visible{outline:3px solid #d8aa42;outline-offset:-3px}.mask{position:absolute;z-index:3;pointer-events:none}.navy{background:#07305b}.white{background:#fff}.toolbar-mask{left:416px;top:81px;width:238px;height:48px;background:linear-gradient(90deg,#07305b,#0b4077)}.thumb-number-mask{left:275px;top:766px;width:980px;height:22px;background:#fff}.pill{left:188px;width:25px;height:24px;border-radius:5px;background:#092f59}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#062d5b;color:#fff;border:1px solid #d7aa43;border-radius:10px;padding:10px 16px;z-index:20;display:none;white-space:nowrap}.toast.show{display:block}.zoom-dock{position:fixed;left:14px;bottom:14px;z-index:15;display:flex;gap:8px}.zoom-dock button{width:42px;height:42px;border:1px solid #c9d4df;border-radius:10px;background:#fff;color:#062d5b;font-size:22px;font-weight:900;box-shadow:0 5px 18px rgba(0,35,70,.18)}@media print{.zoom-dock,.toast,.hotspot,.mask{display:none!important}.stage{overflow:visible}.canvas{transform:none!important;box-shadow:none}}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="canvas" id="canvas"><img id="reference" alt="الواجهة المعتمدة لنظام إدارة توزيع الطاقة الكهربائية">
<div class="mask toolbar-mask"></div>
<div class="mask thumb-number-mask"></div>

<a class="hotspot" style="left:11px;top:128px;width:205px;height:38px" href="#home" data-name="الصفحة الرئيسية"></a>
<a class="hotspot" style="left:11px;top:171px;width:205px;height:38px" href="#contents" data-name="الفهرس"></a>

<button class="hotspot" id="printBtn" style="left:984px;top:23px;width:66px;height:36px" aria-label="طباعة"></button>
<button class="hotspot" id="fullBtn" style="left:1058px;top:23px;width:88px;height:36px" aria-label="ملء الشاشة"></button>
<button class="hotspot" id="langBtn" style="left:1151px;top:23px;width:55px;height:36px" aria-label="اللغة"></button>
<button class="hotspot" id="prevBtn" style="left:265px;top:91px;width:135px;height:34px" aria-label="القسم السابق"></button>
<button class="hotspot" id="nextBtn" style="left:1131px;top:91px;width:126px;height:34px" aria-label="القسم التالي"></button>
</div></div>
<div class="zoom-dock"><button id="zoomOut">−</button><button id="zoomIn">＋</button></div><div class="toast" id="toast"></div>
<script>
const stage=document.getElementById('stage'),canvas=document.getElementById('canvas'),toast=document.getElementById('toast');let scale=1;
fetch('approved-reference.b64?v=1').then(r=>r.text()).then(t=>document.getElementById('reference').src='data:image/jpeg;base64,'+t.trim());
function fit(){scale=Math.min(1,innerWidth/1280);document.documentElement.style.setProperty('--scale',scale);}
function setScale(v){scale=Math.max(.35,Math.min(1.8,v));document.documentElement.style.setProperty('--scale',scale);}
function show(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}
addEventListener('load',fit);addEventListener('resize',()=>{if(innerWidth<900)fit()});
document.getElementById('zoomIn').onclick=()=>setScale(scale+.1);document.getElementById('zoomOut').onclick=()=>setScale(scale-.1);
document.getElementById('fullBtn').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('printBtn').onclick=()=>window.print();document.getElementById('langBtn').onclick=()=>show('العربية / English');document.getElementById('prevBtn').onclick=()=>show('القسم السابق');document.getElementById('nextBtn').onclick=()=>show('القسم التالي');
document.querySelectorAll('[data-name]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();show('فتح '+el.dataset.name)}));
</script>
</body></html>
