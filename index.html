<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=.25,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
  <meta name="theme-color" content="#062a54">
  <meta name="description" content="King Faisal Military Hospital Electrical Distribution Management System">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>KFMH Electrical Distribution System</title>
  <link rel="stylesheet" href="styles.css?v=20260804-0623">
  <link rel="stylesheet" href="extras.css?v=20260804-0623">
  <link rel="stylesheet" href="support-sections.css?v=20260804-0623">
  <style>
    #boot-status{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#f4f7fb;font-family:Tahoma,Arial,sans-serif;color:#062a54;padding:24px;text-align:center}
    #boot-status .boot-card{width:min(520px,92vw);background:#fff;border:1px solid #d8e0ea;border-top:5px solid #d5a83f;border-radius:18px;padding:28px;box-shadow:0 18px 45px rgba(6,42,84,.14)}
    #boot-status strong{display:block;font-size:22px;margin-bottom:8px}#boot-status small{display:block;color:#657487;line-height:1.8}
    #boot-status .spinner{width:38px;height:38px;margin:0 auto 18px;border:4px solid #d8e0ea;border-top-color:#062a54;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="boot-status"><div class="boot-card"><div class="spinner"></div><strong>جاري فتح نظام إدارة توزيع الطاقة الكهربائية</strong><small>Electrical Distribution Management System<br>إعداد المشروع الفني/ عبدالله عسيري</small></div></div>
  <noscript><div style="padding:30px;font-family:Arial;text-align:center">يتطلب النظام تفعيل JavaScript.<br>This system requires JavaScript.</div></noscript>
  <script>
    window.addEventListener('error', function () {
      var box = document.getElementById('boot-status');
      if (box) box.innerHTML = '<div class="boot-card"><strong>تعذر تحميل النظام</strong><small>أعد تحميل الصفحة مرة واحدة. إذا استمرت المشكلة فسيتم فحص النشر.</small></div>';
    });
    setTimeout(function(){
      var box=document.getElementById('boot-status');
      if(box && document.body.contains(box)) box.querySelector('small').innerHTML='استغرق التحميل وقتًا أطول من المعتاد.<br>أعد تحميل الصفحة مرة واحدة.';
    },12000);
  </script>
  <script src="data.js?v=20260804-0623"></script>
  <script src="data-patches.js?v=20260804-0623"></script>
  <script src="support-data.js?v=20260804-0623"></script>
  <script src="app.js?v=20260804-0623"></script>
  <script src="extras.js?v=20260804-0623"></script>
  <script src="support-sections.js?v=20260804-0623"></script>
  <script src="project-credit.js?v=20260804-0623"></script>
</body>
</html>
