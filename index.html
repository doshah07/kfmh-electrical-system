<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=.1,maximum-scale=5,user-scalable=no,viewport-fit=cover">
<title>نظام إدارة توزيع الطاقة الكهربائية | مستشفى الملك فيصل العسكري</title>
<style>
:root{--navy:#082b50;--navy2:#061f3a;--gold:#eda91f;--white:#fff;--sidebar:270px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe6ee;font-family:Tahoma,Arial,sans-serif}
button,input{font:inherit}.vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#e8edf3}.vp.drag{cursor:grabbing}
.stage{position:absolute;left:0;top:0;width:1806px;height:1024px;display:flex;direction:ltr;transform-origin:0 0;will-change:transform;user-select:none}
.sidebar{width:270px;height:1024px;flex:0 0 270px;background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;border-right:3px solid var(--gold);display:flex;flex-direction:column;direction:rtl;box-shadow:8px 0 24px rgba(4,24,46,.22)}
.brand{padding:24px 16px 18px;text-align:center;border-bottom:1px solid rgba(237,169,31,.45)}
.brand-mark{width:96px;height:96px;margin:0 auto 12px;border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--navy);font-weight:900;font-size:22px;line-height:1.05}
.brand .ar{font-size:20px;font-weight:900;line-height:1.5}.brand .en{font-size:11px;color:#ffc44d;font-weight:800;letter-spacing:.3px;margin-top:5px}
.menu-title{padding:18px 18px 9px;font-size:23px;font-weight:900}.menu-title:after{content:"";display:block;height:3px;background:var(--gold);margin-top:8px}
.nav{padding:0 12px 16px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.nav button,.sub button{width:100%;border:1px solid var(--gold);background:#0b3a67;color:#fff;border-radius:12px;padding:12px;margin:5px 0;text-align:right;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav button:hover,.nav button.active{background:var(--gold);color:#071d35}.label{display:block;font-weight:900;font-size:15px}.en{display:block;font-size:9px;font-weight:800;color:#ffc44d;margin-top:3px}.nav button:hover .en,.nav button.active .en{color:#071d35}.icon{width:25px;text-align:center;font-size:19px}
.sub{display:none;padding:0 7px}.sub.open{display:block}.sub button{background:#072d52;padding:10px 12px}
.credit{margin-top:auto;padding:14px;text-align:center;border-top:1px solid rgba(237,169,31,.55)}.credit .ar{font-size:13px}.credit .en{font-size:10px;color:#ffc44d;margin-top:4px}
.home{position:relative;width:1536px;height:1024px;flex:0 0 1536px;background:#fff;overflow:hidden}.home img{display:block;width:1536px;height:1024px;object-fit:contain;pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent;border-radius:14px;cursor:pointer}.hotspot:hover{outline:4px solid rgba(237,169,31,.9);background:rgba(237,169,31,.08)}
.controls{position:fixed;right:12px;bottom:12px;z-index:30;display:flex;gap:5px;direction:ltr;background:rgba(6,31,58,.94);padding:6px;border:1px solid var(--gold);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.controls button{width:38px;height:34px;border:0;border-radius:8px;background:#0d477c;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.controls button:hover{background:var(--gold);color:#071d35}.controls span{min-width:55px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
.hint{position:fixed;left:12px;bottom:12px;z-index:25;background:rgba(6,31,58,.88);color:#fff;border:1px solid rgba(237,169,31,.75);border-radius:10px;padding:7px 10px;font-size:11px}
.backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(1,14,28,.72);z-index:100}.backdrop.open{display:flex}.modal{width:min(760px,92vw);max-height:86vh;overflow:auto;background:#fff;border-radius:18px;border:3px solid var(--gold);box-shadow:0 22px 60px rgba(0,0,0,.4)}
.mhead{background:linear-gradient(90deg,var(--navy2),var(--navy));color:#fff;padding:17px 20px;display:flex;align-items:center;justify-content:space-between}.mhead h2{margin:0;font-size:22px}.close{border:0;background:transparent;color:#fff;font-size:30px;cursor:pointer}.mbody{padding:22px}.path{direction:ltr;text-align:center;background:#f3f6fa;border:1px solid #cad5e1;border-radius:12px;padding:18px;font-size:21px;font-weight:900;line-height:1.8;color:#092c51}.note{margin-top:14px;color:#45566c;font-size:14px;line-height:1.8}.card{border:1px solid #cfd9e4;border-radius:12px;padding:15px;background:#f8fafc}.field{margin:10px 0}.field label{display:block;margin-bottom:6px;font-weight:900}.field input{width:100%;padding:10px;border:1px solid #bac7d5;border-radius:8px}.primary{border:0;background:var(--gold);color:#071d35;padding:10px 16px;border-radius:9px;font-weight:900;cursor:pointer}.trgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.trgrid button{border:1px solid var(--gold);background:#0b3a67;color:#fff;border-radius:10px;padding:13px 6px;font-weight:900;cursor:pointer}
@media(max-width:700px){.controls{right:8px;bottom:8px;transform:scale(.92);transform-origin:bottom right}.hint{display:none}}
</style>
</head>
<body>
<div id="vp" class="vp">
  <div id="stage" class="stage">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">KFMH</div><div class="ar">مستشفى الملك فيصل العسكري</div><div class="en">KING FAISAL MILITARY HOSPITAL</div></div>
      <div class="menu-title">القائمة الرئيسية</div>
      <nav class="nav" id="nav">
        <button class="active" data-section="home"><span><span class="label">الرئيسية</span><span class="en">HOME</span></span><span class="icon">⌂</span></button>
        <button data-section="transformers"><span><span class="label">المحولات</span><span class="en">TRANSFORMERS</span></span><span class="icon">⚡</span></button>
        <button data-section="generators"><span><span class="label">المولدات</span><span class="en">GENERATORS</span></span><span class="icon">◉</span></button>
        <button data-section="batteries"><span><span class="label">البطاريات</span><span class="en">BATTERIES</span></span><span class="icon">▣</span></button>
        <button data-section="mdp"><span><span class="label">لوحات التوزيع الرئيسية</span><span class="en">MDP</span></span><span class="icon">▤</span></button>
        <button data-section="mp"><span><span class="label">لوحات التشغيل الرئيسية</span><span class="en">MP</span></span><span class="icon">▥</span></button>
        <button data-section="pp"><span><span class="label">لوحات التوزيع الفرعية</span><span class="en">PP</span></span><span class="icon">▦</span></button>
        <button data-section="labels"><span><span class="label">الملصق الخارجي</span><span class="en">EXTERNAL LABEL</span></span><span class="icon">🏷</span></button>
        <button id="settingsToggle"><span><span class="label">الإعدادات</span><span class="en">SETTINGS</span></span><span class="icon">⚙</span></button>
        <div class="sub" id="settingsSub"><button data-section="browser"><span><span class="label">إعدادات المتصفح</span><span class="en">BROWSER SETTINGS</span></span><span class="icon">◫</span></button><button data-section="login"><span><span class="label">تسجيل الدخول</span><span class="en">LOGIN</span></span><span class="icon">🔐</span></button></div>
        <button data-section="about"><span><span class="label">حول المشروع</span><span class="en">ABOUT PROJECT</span></span><span class="icon">ⓘ</span></button>
      </nav>
      <div class="credit"><div class="ar">إعداد الفني / عبدالله عسيري</div><div class="en">Prepared by Technician / Abdullah Asiri</div></div>
    </aside>
    <main class="home"><img id="master" alt="الصفحة الرئيسية لنظام توزيع الطاقة الكهربائية"><button class="hotspot" data-tr="TR1" style="left:20px;top:625px;width:280px;height:355px"></button><button class="hotspot" data-tr="TR2" style="left:318px;top:625px;width:280px;height:355px"></button><button class="hotspot" data-tr="TR3" style="left:618px;top:625px;width:280px;height:355px"></button><button class="hotspot" data-tr="TR4" style="left:918px;top:625px;width:280px;height:355px"></button><button class="hotspot" data-tr="TR5" style="left:1218px;top:625px;width:295px;height:355px"></button></main>
  </div>
</div>
<div class="controls"><button id="minus">−</button><span id="zv">100%</span><button id="plus">+</button><button id="natural">100</button><button id="fit">↔</button></div>
<div class="hint">اسحب في جميع الاتجاهات — استخدم عجلة الماوس أو إصبعين للتكبير والتصغير</div>
<div class="backdrop" id="modal"><section class="modal"><div class="mhead"><h2 id="mtitle">التفاصيل</h2><button class="close" id="mclose">×</button></div><div class="mbody" id="mbody"></div></section></div>
<script>
(async()=>{
 const master=document.getElementById('master');
 try{const t=await fetch('assets/dashboard-master-v2.b64').then(r=>r.text());master.src='data:image/png;base64,'+t.trim()}catch(e){master.alt='تعذر تحميل الصفحة الرئيسية'}
 const vp=document.getElementById('vp'),stage=document.getElementById('stage'),zv=document.getElementById('zv');
 const W=1806,H=1024,MIN=.12,MAX=3;let z=1,x=0,y=12;const pts=new Map();let g=null;
 function clamp(){const vw=vp.clientWidth,vh=vp.clientHeight,sw=W*z,sh=H*z,p=12;if(sw<=vw)x=(vw-sw)/2;else x=Math.max(vw-sw-p,Math.min(p,x));if(sh<=vh)y=p;else y=Math.max(vh-sh-p,Math.min(p,y))}
 function draw(){clamp();stage.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px) scale(${z})`;zv.textContent=Math.round(z*100)+'%'}
 function zoomAt(n,cx=vp.clientWidth/2,cy=vp.clientHeight/2){n=Math.max(MIN,Math.min(MAX,n));const px=(cx-x)/z,py=(cy-y)/z;x=cx-px*n;y=cy-py*n;z=n;draw()}
 function fitView(){const m=12;z=Math.min((vp.clientWidth-m*2)/W,(vp.clientHeight-m*2)/H);z=Math.max(MIN,Math.min(1,z));x=(vp.clientWidth-W*z)/2;y=m;draw()}
 function natural(){z=1;x=(vp.clientWidth-W)/2;y=12;draw()}
 const list=()=>[...pts.values()],mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
 vp.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;vp.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});vp.classList.add('drag');const a=list();if(a.length===1)g={t:'pan',sx:e.clientX,sy:e.clientY,bx:x,by:y};else if(a.length===2){const m=mid(a[0],a[1]);g={t:'pinch',d:dist(a[0],a[1]),z,wx:(m.x-x)/z,wy:(m.y-y)/z}}});
 vp.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=list();if(a.length===1&&g?.t==='pan'){x=g.bx+a[0].x-g.sx;y=g.by+a[0].y-g.sy;draw()}else if(a.length===2){if(g?.t!=='pinch'){const m=mid(a[0],a[1]);g={t:'pinch',d:dist(a[0],a[1]),z,wx:(m.x-x)/z,wy:(m.y-y)/z}}const m=mid(a[0],a[1]),n=Math.max(MIN,Math.min(MAX,g.z*dist(a[0],a[1])/g.d));x=m.x-g.wx*n;y=m.y-g.wy*n;z=n;draw()}});
 function end(e){pts.delete(e.pointerId);const a=list();if(a.length===1)g={t:'pan',sx:a[0].x,sy:a[0].y,bx:x,by:y};else{g=null;vp.classList.remove('drag')}}vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end);
 vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(z*(e.deltaY<0?1.1:.9),e.clientX,e.clientY)},{passive:false});
 minus.onclick=()=>zoomAt(z/1.15);plus.onclick=()=>zoomAt(z*1.15);natural.onclick=natural;fit.onclick=fitView;addEventListener('resize',fitView);requestAnimationFrame(fitView);
 const paths={TR1:'RMU (OS) → TR1 → MDP1 → MP1 / MP5 / MP4 / MP3 → PP1',TR2:'RMU1 → TR2 → FED2 → ATS4 → MDP2 → MP1…MP8 → PP',TR3:'RMU1 → TR3 → FED3 → ATS5 → MDP3 → MP1…MP14 → PP',TR4:'RMU (OS) → TR4 → ATS3 → MDP4 → MP1…MP5 → PP',TR5:'RMU (OS) → TR5 → ATS3 (Manual) → MDP5 → MP1…MP6 → PP'};
 const modal=document.getElementById('modal'),mtitle=document.getElementById('mtitle'),mbody=document.getElementById('mbody');function open(t,b){mtitle.textContent=t;mbody.innerHTML=b;modal.classList.add('open')}function close(){modal.classList.remove('open')}mclose.onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
 document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>open('تفاصيل المحول '+b.dataset.tr,`<div class="path">${paths[b.dataset.tr]}</div><div class="note">مسار التغذية الكامل من المصدر حتى لوحات التوزيع التابعة للمحول.</div>`));
 settingsToggle.onclick=()=>settingsSub.classList.toggle('open');
 document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(q=>q.classList.remove('active'));b.classList.add('active');const s=b.dataset.section;if(s==='home'){fitView();return}if(s==='transformers'){open('المحولات',`<div class="trgrid">${Object.keys(paths).map(k=>`<button data-p="${k}">${k}</button>`).join('')}</div>`);setTimeout(()=>document.querySelectorAll('[data-p]').forEach(q=>q.onclick=()=>open('تفاصيل المحول '+q.dataset.p,`<div class="path">${paths[q.dataset.p]}</div>`)),0);return}if(s==='browser'){open('إعدادات المتصفح',`<div class="card"><div class="field"><label>نسبة التكبير</label><input id="range" type="range" min="12" max="300" value="${Math.round(z*100)}"></div><button class="primary" id="save">حفظ الإعداد</button></div>`);setTimeout(()=>save.onclick=()=>{zoomAt(parseInt(range.value)/100);localStorage.setItem('kfmhZoom',range.value);close()},0);return}if(s==='login'){open('تسجيل الدخول',`<div class="card"><div class="field"><label>اسم المستخدم</label><input autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input type="password" autocomplete="current-password"></div><button class="primary">تسجيل الدخول</button></div>`);return}const names={generators:'المولدات',batteries:'البطاريات',mdp:'لوحات التوزيع الرئيسية MDP',mp:'لوحات التشغيل الرئيسية MP',pp:'لوحات التوزيع الفرعية PP',labels:'الملصق الخارجي',about:'حول المشروع'};open(names[s]||'القسم',`<div class="card"><h3>${names[s]||'القسم'}</h3><div class="note">سيتم فتح صفحات هذا القسم مع بقاء القائمة وأدوات التكبير والسحب متاحة.</div></div>`)});
})();
</script>
</body></html>
