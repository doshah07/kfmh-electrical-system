<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=.2,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>نظام إدارة توزيع الطاقة الكهربائية</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#061b31;font-family:Tahoma,Arial,sans-serif}
body{overflow:auto;-webkit-overflow-scrolling:touch}
#wrap{width:100vw;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;background:#061b31}
#p{position:relative;width:100vw;max-width:1536px;aspect-ratio:16/9;background:#061b31;overflow:hidden}
#p img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}
button.h{position:absolute;border:0;background:transparent;border-radius:12px;cursor:pointer}
button.h:hover,button.h:focus-visible{outline:3px solid #e9a52c;background:#e9a52c22}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#e9a52c;background:#061b31;font-size:clamp(18px,3vw,28px);z-index:3}
#m{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#001326cc;z-index:9}
#m.o{display:flex}
.b{width:min(760px,92vw);max-height:86dvh;overflow:auto;background:#fff;border:3px solid #e9a52c;border-radius:18px;color:#0a2c4e}
.t{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;background:#062743;color:#fff;border-bottom:3px solid #e9a52c}
.t h2{margin:0;font-size:clamp(20px,3vw,28px)}
.x{border:0;background:transparent;color:#fff;font-size:34px}
.c{padding:22px;font-size:18px;line-height:1.9}
.path{direction:ltr;text-align:center;background:#f3f6f9;border:1px solid #c9d5e1;border-radius:12px;padding:18px;font-weight:900}
@media (orientation:landscape){#p{height:100dvh;width:auto;max-width:none}}
</style>
</head>
<body>
<div id="wrap">
<main id="p">
<div id="loading">جاري تحميل النظام…</div>
<img id="master" alt="لوحة التحكم">
<button class="h" data-s="home" style="left:1.1%;top:7.7%;width:14.7%;height:5.8%"></button>
<button class="h" data-s="transformers" style="left:1.1%;top:14.2%;width:14.7%;height:5.8%"></button>
<button class="h" data-s="generators" style="left:1.1%;top:20.9%;width:14.7%;height:5.8%"></button>
<button class="h" data-s="batteries" style="left:1.1%;top:27.7%;width:14.7%;height:5.8%"></button>
<button class="h" data-s="mdp" style="left:1.1%;top:34.5%;width:14.7%;height:5.8%"></button>
<button class="h" data-s="mp" style="left:1.1%;top:41.2%;width:14.7%;height:5.8%"></button>
<button class="h" data-s="pp" style="left:1.1%;top:48%;width:14.7%;height:5.8%"></button>
<button class="h" data-s="label" style="left:1.1%;top:54.7%;width:14.7%;height:5.8%"></button>
<button class="h" data-s="browser" style="left:3%;top:66.8%;width:12%;height:4.5%"></button>
<button class="h" data-s="login" style="left:3%;top:72.6%;width:12%;height:4.5%"></button>
<button class="h" data-s="about" style="left:1.1%;top:78%;width:14.7%;height:5.8%"></button>
<button class="h" data-tr="TR1" style="left:19.2%;top:72.4%;width:14.1%;height:24.2%"></button>
<button class="h" data-tr="TR2" style="left:34.7%;top:72.4%;width:14.1%;height:24.2%"></button>
<button class="h" data-tr="TR3" style="left:50.2%;top:72.4%;width:14.1%;height:24.2%"></button>
<button class="h" data-tr="TR4" style="left:65.7%;top:72.4%;width:14.1%;height:24.2%"></button>
<button class="h" data-tr="TR5" style="left:81.2%;top:72.4%;width:14.1%;height:24.2%"></button>
</main>
</div>
<section id="m"><div class="b"><div class="t"><h2 id="mt">التفاصيل</h2><button id="mx" class="x">×</button></div><div id="mc" class="c"></div></div></section>
<script>
(async()=>{
  const root='https://raw.githubusercontent.com/doshah07/kfmh-electrical-system/d5c0f0edd2e8de119143843dbf1cf299a011f2bc/assets/';
  const parts=await Promise.all([...Array(6)].map((_,i)=>fetch(root+`av${i}.txt`).then(r=>{if(!r.ok)throw new Error('asset '+i);return r.text()})));
  const img=document.getElementById('master');
  const loading=document.getElementById('loading');
  img.onload=()=>loading.remove();
  img.onerror=()=>loading.textContent='تعذر تحميل الصورة';
  img.src='data:image/avif;base64,'+parts.join('');
})().catch(()=>document.getElementById('loading').textContent='تعذر تحميل الصفحة');
const P={TR1:'RMU (OS) → TR1 → MDP1 → MP1 / MP5 / MP4 / MP3 → PP1',TR2:'RMU1 → TR2 → FED2 → ATS4 → MDP2 → MP1…MP8 → PP',TR3:'RMU1 → TR3 → FED3 → ATS5 → MDP3 → MP1…MP14 → PP',TR4:'RMU (OS) → TR4 → ATS3 → MDP4 → MP1…MP5 → PP',TR5:'RMU (OS) → TR5 → ATS3 (Manual) → MDP5 → MP1…MP6 → PP'};
const N={transformers:'المحولات',generators:'المولدات',batteries:'البطاريات',mdp:'لوحات التوزيع الرئيسية MDP',mp:'لوحات التشغيل الرئيسية MP',pp:'لوحات التوزيع الفرعية PP',label:'الملصق الخارجي',browser:'إعدادات المتصفح',login:'تسجيل الدخول',about:'حول المشروع'};
const m=document.getElementById('m'),mt=document.getElementById('mt'),mc=document.getElementById('mc');
function o(t,c){mt.textContent=t;mc.innerHTML=c;m.classList.add('o')}
function q(){m.classList.remove('o')}
document.getElementById('mx').onclick=q;
m.onclick=e=>{if(e.target===m)q()};
document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>o('تفاصيل المحول '+b.dataset.tr,'<div class="path">'+P[b.dataset.tr]+'</div>'));
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
 let s=b.dataset.s;if(s==='home')return;
 o(N[s]||'القسم','<div>'+((s==='login')?'اسم المستخدم<br><input style="width:100%;padding:12px"><br><br>كلمة المرور<br><input type="password" style="width:100%;padding:12px">':'سيتم فتح هذا القسم داخل نفس واجهة النظام.')+'</div>')
});
</script>
</body>
</html>
