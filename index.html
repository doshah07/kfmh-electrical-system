<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=.1,maximum-scale=5,user-scalable=no,viewport-fit=cover"><title>نظام إدارة توزيع الطاقة الكهربائية</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9eef4;font-family:Tahoma,Arial,sans-serif}.vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#e9eef4}.vp.drag{cursor:grabbing}.stage{position:absolute;left:0;top:0;width:1536px;height:1024px;transform-origin:0 0;will-change:transform}.stage img{display:block;width:1536px;height:1024px;object-fit:contain;image-rendering:auto}.controls{position:fixed;left:14px;bottom:14px;z-index:20;display:flex;gap:7px;direction:ltr;background:rgba(255,255,255,.96);padding:7px;border:1px solid #d7e1eb;border-radius:14px;box-shadow:0 12px 30px rgba(5,42,83,.18)}.controls button{width:44px;height:44px;border:1px solid #d7e1eb;border-radius:9px;background:#fff;color:#062f61;font-size:20px;font-weight:800}.controls span{min-width:62px;display:grid;place-items:center;color:#062f61;font-weight:800}.hint{position:fixed;right:14px;bottom:14px;z-index:20;background:rgba(6,47,97,.94);color:#fff;padding:10px 14px;border-radius:10px;font-size:12px}@media(max-width:700px){.controls{left:10px;bottom:10px}.controls button{width:40px;height:40px}.hint{right:10px;bottom:68px}}</style></head><body><div class="controls"><button id="minus">−</button><span id="zv">100%</span><button id="plus">＋</button><button id="fit">⤢</button><button id="home">⌂</button></div><div class="hint">اسحب بإصبع واحد، وبإصبعين للتكبير والتصغير</div><div id="vp" class="vp"><div id="stage" class="stage"><img id="master" alt="لوحة نظام إدارة توزيع الطاقة الكهربائية"></div></div><script>fetch('assets/dashboard-approved.b64').then(r=>r.text()).then(t=>{document.getElementById('master').src='data:image/webp;base64,'+t.trim()});const W=1536,H=1024,MIN=.1,MAX=4,STEP=.05,vp=document.getElementById('vp'),stage=document.getElementById('stage'),zv=document.getElementById('zv');let z=.45,x=0,y=0,drag=false,sx=0,sy=0,bx=0,by=0,pinch=0,startZ=1;function clamp(){const w=W*z,h=H*z,p=18;x=Math.max(Math.min(p,innerWidth-w-p),Math.min(Math.max(p,innerWidth-w-p),x));y=Math.max(Math.min(p,innerHeight-h-p),Math.min(Math.max(p,innerHeight-h-p),y))}function draw(){clamp();stage.style.transform=`translate3d(${x}px,${y}px,0) scale(${z})`;zv.textContent=Math.round(z*100)+'%'}function set45(){z=.45;x=(innerWidth-W*z)/2;y=(innerHeight-H*z)/2;draw()}function fit(){z=Math.min((innerWidth-20)/W,(innerHeight-20)/H);x=(innerWidth-W*z)/2;y=(innerHeight-H*z)/2;draw()}function zoom(d,cx=innerWidth/2,cy=innerHeight/2){const o=z;z=Math.max(MIN,Math.min(MAX,z+d));const r=z/o;x=cx-(cx-x)*r;y=cy-(cy-y)*r;draw()}minus.onclick=()=>zoom(-STEP);plus.onclick=()=>zoom(STEP);fit.onclick=fit;home.onclick=set45;vp.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=true;vp.classList.add('drag');vp.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;bx=x;by=y});vp.addEventListener('pointermove',e=>{if(!drag)return;x=bx+e.clientX-sx;y=by+e.clientY-sy;draw()});['pointerup','pointercancel'].forEach(n=>vp.addEventListener(n,()=>{drag=false;vp.classList.remove('drag')}));vp.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?STEP:-STEP,e.clientX,e.clientY)},{passive:false});vp.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);startZ=z}},{passive:false});vp.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2,o=z;z=Math.max(MIN,Math.min(MAX,startZ*d/pinch));const r=z/o;x=mx-(mx-x)*r;y=my-(my-y)*r;draw()}},{passive:false});addEventListener('resize',set45);addEventListener('load',set45);</script></body></html>
